name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & format check (Biome)
        run: npx biome ci .

  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Retrieval eval gate (BM25 recall@5 vs evals/retrieval/baseline.json)
        run: npm run eval:retrieval -- --check

      - name: Verify package contents
        run: npm pack --dry-run

  # Keeps the branch-protection contexts "build-and-test (20)" / "(22)" reporting
  # now that the matrix also spans OSes; green only if every matrix leg passed.
  build-and-test-required:
    name: build-and-test (${{ matrix.node-version }})
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - run: test "${{ needs.build-and-test.result }}" = success
